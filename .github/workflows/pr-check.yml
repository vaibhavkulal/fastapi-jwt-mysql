name: Pull Request Checks

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          # Tests override the application's DB session with an isolated SQLite DB.
          # These values only allow app.database to construct its MySQL engine at import time.
          DB_HOST: localhost
          DB_PORT: '3306'
          DB_NAME: fastapi_auth_test
          DB_USER: test
          DB_PASSWORD: test
          JWT_SECRET: ci-test-secret
          JWT_ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: '30'
          RESET_TOKEN_EXPIRE_MINUTES: '15'
        run: pytest -q
