name: Post-Merge Verification

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          DB_HOST: localhost
          DB_PORT: '3306'
          DB_NAME: fastapi_auth_test
          DB_USER: test
          DB_PASSWORD: test
          JWT_SECRET: ci-test-secret
          JWT_ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: '30'
          RESET_TOKEN_EXPIRE_MINUTES: '15'
        run: pytest -q

      - name: Report verification failure
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const sha = context.sha;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = `Post-merge verification failed on main (${sha.slice(0,7)})`;
            const body = `Automated post-merge verification failed for commit \`${sha}\` on \`main\`.\n\nPlease inspect the failed workflow before reverting or creating a rollback PR. This workflow does **not** automatically modify or revert \`main\`.\n\nWorkflow run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const existing = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', per_page: 100 });
            if (existing.some(i => !i.pull_request && i.title === title)) return;
            const issue = await github.rest.issues.create({ owner, repo, title, body, labels: [] });
            core.info(`Created rollback/verification issue #${issue.data.number}.`);
