name: Documentation Check

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  documentation:
    name: Documentation Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check documentation structure
        shell: bash
        run: |
          set -e
          required_files=(
            docs/PROJECT.md
            docs/ARCHITECTURE.md
            docs/FEATURES.md
            docs/API.md
            docs/DATABASE.md
            docs/DEVELOPMENT.md
            docs/CHANGELOG.md
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "Missing documentation file: $file"
              exit 1
            fi
          done

          echo "Documentation structure is valid."

      - name: Detect documentation-relevant changes
        shell: bash
        run: |
          set -e
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"

          echo "Changed files:"
          git diff --name-only "$base" "$head"

          echo
          echo "Documentation should be reviewed when changes affect:" 
          echo "- app/"
          echo "- alembic/"
          echo "- requirements.txt"
          echo "- API behavior"
          echo "- authentication or authorization"
          echo "- database models or migrations"

      - name: Documentation summary
        run: |
          echo "Documentation check completed for PR #${{ github.event.pull_request.number }}."
          echo "Generated/structured documentation lives under docs/."
