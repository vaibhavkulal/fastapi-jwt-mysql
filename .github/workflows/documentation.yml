name: Pull Request Documentation

on:
  pull_request_target:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  documentation:
    name: Update PR Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Update documentation from PR metadata
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = pr.head.ref;

            if (pr.head.repo.full_name !== `${owner}/${repo}`) {
              core.info('PR comes from a fork; skipping automatic documentation commit.');
              return;
            }

            const { data: files } = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner,
                repo,
                pull_number: pr.number,
                per_page: 100
              }
            );

            const changed = files.map(file => file.filename);
            const hasApplicationChanges = changed.some(path =>
              path.startsWith('app/') ||
              path.startsWith('alembic/') ||
              path.startsWith('tests/') ||
              path === 'requirements.txt'
            );

            if (!hasApplicationChanges) {
              core.info('No application-level changes detected; no documentation update needed.');
              return;
            }

            const marker = `<!-- pr-doc: #${pr.number} -->`;
            const title = pr.title.replace(/\r?\n/g, ' ').trim();
            const labels = (pr.labels || []).map(label => label.name).join(', ');

            const categories = new Set();
            for (const path of changed) {
              if (path.startsWith('app/routers/')) categories.add('API/routes');
              if (path.startsWith('app/services/')) categories.add('Application/services');
              if (path.startsWith('app/models/') || path.startsWith('alembic/')) categories.add('Database/schema');
              if (path.startsWith('app/core/')) categories.add('Core/security/configuration');
              if (path.startsWith('app/schemas/')) categories.add('API schemas/validation');
              if (path.startsWith('tests/')) categories.add('Tests');
              if (path === 'requirements.txt') categories.add('Dependencies');
            }

            const categoryText = [...categories].map(item => `- ${item}`).join('\n') || '- Application changes';
            const fileText = changed.map(path => `- \`${path}\``).join('\n');
            const date = new Date().toISOString().slice(0, 10);

            const entry = `${marker}\n### PR #${pr.number} — ${title}\n\n- Date: ${date}\n- Branch: \`${branch}\`\n- Labels: ${labels || 'none'}\n\n**Detected areas**\n${categoryText}\n\n**Changed files**\n${fileText}\n\n`;

            const path = 'docs/CHANGELOG.md';
            const current = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
            const content = Buffer.from(current.data.content, 'base64').toString('utf8');

            const markerIndex = content.indexOf(marker);
            let updated;
            if (markerIndex >= 0) {
              const afterMarker = content.slice(markerIndex);
              const nextHeading = afterMarker.indexOf('\n### ', marker.length);
              const end = nextHeading >= 0 ? markerIndex + nextHeading + 1 : content.length;
              updated = content.slice(0, markerIndex) + entry + content.slice(end);
            } else {
              const heading = '## Unreleased';
              const headingIndex = content.indexOf(heading);
              if (headingIndex >= 0) {
                const insertAt = headingIndex + heading.length;
                updated = content.slice(0, insertAt) + '\n\n' + entry + content.slice(insertAt);
              } else {
                updated = content + `\n\n${heading}\n\n${entry}`;
              }
            }

            if (updated === content) {
              core.info('Documentation is already up to date.');
              return;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              message: `docs: update changelog for PR #${pr.number}`,
              content: Buffer.from(updated, 'utf8').toString('base64'),
              branch,
              sha: current.data.sha
            });

            core.info(`Updated ${path} on branch ${branch}.`);
