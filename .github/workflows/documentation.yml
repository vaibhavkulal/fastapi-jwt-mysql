name: PR Automation

on:
  pull_request_target:
    branches:
      - main
    types: [opened, synchronize, reopened, closed]
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  pr-metadata:
    name: Assign PR and add labels
    if: github.event_name == 'pull_request_target' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Assign author and classify PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            if (pr.head.repo.full_name !== `${owner}/${repo}`) {
              core.info('Fork PR detected; metadata assignment is skipped.');
              return;
            }

            const labels = new Set((pr.labels || []).map(l => l.name));
            const title = pr.title.toLowerCase();
            const branch = pr.head.ref.toLowerCase();

            if (branch.startsWith('feature/') || title.startsWith('feat')) labels.add('feature');
            else if (branch.startsWith('fix/') || title.startsWith('fix')) labels.add('bug');
            else if (branch.startsWith('refactor/')) labels.add('refactor');
            else if (branch.startsWith('test/')) labels.add('tests');
            else if (branch.startsWith('docs/') || title.startsWith('docs')) labels.add('documentation');
            else if (branch.startsWith('chore/')) labels.add('chore');

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100
            });
            const paths = files.map(f => f.filename);
            if (paths.some(p => p.startsWith('.github/'))) labels.add('ci');
            if (paths.some(p => p.startsWith('alembic/') || p.includes('models/'))) labels.add('database');
            if (paths.some(p => p.startsWith('app/routers/'))) labels.add('api');
            if (paths.some(p => p.startsWith('tests/'))) labels.add('tests');

            const labelColors = {
              feature: '1d76db',
              bug: 'd73a4a',
              refactor: '5319e7',
              tests: '0e8a16',
              documentation: '0075ca',
              chore: '6f42c1',
              ci: 'fbca04',
              database: 'b60205',
              api: '0052cc'
            };

            const finalLabels = [...labels].filter(name => labelColors[name]);
            for (const name of finalLabels) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner, repo, name, color: labelColors[name],
                  description: `Automatically managed ${name} PR label`
                });
              }
            }
            await github.rest.issues.setLabels({ owner, repo, issue_number: pr.number, labels: finalLabels });

            await github.rest.issues.addAssignees({
              owner, repo, issue_number: pr.number, assignees: [pr.user.login]
            });

  documentation:
    name: Update PR Documentation
    if: github.event_name == 'pull_request_target' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Update changelog for same-repository PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            if (pr.head.repo.full_name !== `${owner}/${repo}`) return;

            const { data: files } = await github.rest.pulls.listFiles({
              owner, repo, pull_number: pr.number, per_page: 100
            });
            const changed = files.map(file => file.filename);
            const relevant = changed.some(path =>
              path.startsWith('app/') || path.startsWith('alembic/') ||
              path.startsWith('tests/') || path === 'requirements.txt'
            );
            if (!relevant) return;

            const path = 'docs/CHANGELOG.md';
            const marker = `<!-- pr-doc: #${pr.number} -->`;
            const current = await github.rest.repos.getContent({ owner, repo, path, ref: pr.head.ref });
            const content = Buffer.from(current.data.content, 'base64').toString('utf8');
            const categories = new Set();
            for (const file of changed) {
              if (file.startsWith('app/routers/')) categories.add('API/routes');
              if (file.startsWith('app/services/')) categories.add('Application/services');
              if (file.startsWith('app/models/') || file.startsWith('alembic/')) categories.add('Database/schema');
              if (file.startsWith('app/core/')) categories.add('Core/security/configuration');
              if (file.startsWith('app/schemas/')) categories.add('API schemas/validation');
              if (file.startsWith('tests/')) categories.add('Tests');
              if (file === 'requirements.txt') categories.add('Dependencies');
            }
            const entry = `${marker}\n### PR #${pr.number} — ${pr.title.replace(/\r?\n/g, ' ').trim()}\n\n- Date: ${new Date().toISOString().slice(0,10)}\n- Branch: \`${pr.head.ref}\`\n\n**Detected areas**\n${[...categories].map(x => `- ${x}`).join('\n')}\n\n**Changed files**\n${changed.map(x => `- \`${x}\``).join('\n')}\n\n`;
            const markerIndex = content.indexOf(marker);
            let updated;
            if (markerIndex >= 0) {
              const tail = content.slice(markerIndex);
              const next = tail.indexOf('\n### ', marker.length);
              const end = next >= 0 ? markerIndex + next + 1 : content.length;
              updated = content.slice(0, markerIndex) + entry + content.slice(end);
            } else {
              const heading = '## Unreleased';
              const index = content.indexOf(heading);
              updated = index >= 0
                ? content.slice(0, index + heading.length) + '\n\n' + entry + content.slice(index + heading.length)
                : content + `\n\n${heading}\n\n${entry}`;
            }
            if (updated === content) return;
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path,
              message: `docs: update changelog for PR #${pr.number}`,
              content: Buffer.from(updated, 'utf8').toString('base64'),
              branch: pr.head.ref,
              sha: current.data.sha
            });

  update-branches:
    name: Update open PR branches from main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Update same-repository PR branches
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', base: 'main', per_page: 100
            });
            for (const pr of prs) {
              if (pr.head.repo.full_name !== `${owner}/${repo}`) {
                core.info(`Skipping fork PR #${pr.number}`);
                continue;
              }
              try {
                await github.rest.pulls.updateBranch({ owner, repo, pull_number: pr.number, expected_head_sha: pr.head.sha });
                core.info(`Updated PR #${pr.number} from main.`);
              } catch (error) {
                core.warning(`Could not update PR #${pr.number}: ${error.message}`);
              }
            }

  delete-merged-branch:
    name: Delete merged feature branch
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Delete same-repository branch
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = pr.head.ref;
            if (pr.head.repo.full_name !== `${owner}/${repo}`) {
              core.info('Merged PR came from a fork; no branch deletion performed.');
              return;
            }
            if (branch === 'main') {
              core.setFailed('Refusing to delete main.');
              return;
            }
            await github.rest.git.deleteRef({ owner, repo, ref: `heads/${branch}` });
            core.info(`Deleted merged branch ${branch}.`);
