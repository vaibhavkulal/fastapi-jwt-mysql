name: PR Summary

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - name: Maintain PR summary
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            if (pr.head.repo.full_name !== `${owner}/${repo}`) return;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100
            });
            const changed = files.map(f => f.filename);
            const additions = files.reduce((s, f) => s + (f.additions || 0), 0);
            const deletions = files.reduce((s, f) => s + (f.deletions || 0), 0);
            const tests = changed.filter(p => p.startsWith('tests/')).length > 0;
            const docs = changed.some(p => p.startsWith('docs/') || p === 'README.md');
            const body = `<!-- automated-pr-summary -->
## 🤖 PR Summary

**${pr.title}**

### 📋 Changes
- **Files changed:** ${changed.length}
- **Additions:** +${additions}
- **Deletions:** -${deletions}

### 📁 Changed files
${changed.length ? changed.map(p => `- \`${p}\``).join('\n') : '- None'}

### 🧪 Tests
${tests ? '✅ Test files are included in this PR.' : 'ℹ️ No test files detected in the changed files.'}

### 📚 Documentation
${docs ? '✅ Documentation changes detected.' : 'ℹ️ No documentation changes detected.'}

_Last updated automatically from the current PR changes._`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr.number, per_page: 100
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body?.includes('<!-- automated-pr-summary -->'));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
            }
